name: Build Gentoo GNOME ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: gentoo/stage3:latest
      options: --privileged

    env:
      ROOTFS: /gentoo-rootfs

    steps:
      - uses: actions/checkout@v4

      # ---------------- BOOTSTRAP ROOTFS ----------------
      - name: Create rootfs
        run: |
          mkdir -p $ROOTFS
          cp -a / /gentoo-stage-copy || true

      - name: Prepare chroot
        run: |
          mkdir -p $ROOTFS/{dev,proc,sys,run}
          mount --bind /dev $ROOTFS/dev
          mount --bind /proc $ROOTFS/proc
          mount --bind /sys $ROOTFS/sys

      # ---------------- PORTAGE CONFIG ----------------
      - name: Configure Portage in rootfs
        run: |
          cp -r $GITHUB_WORKSPACE/etc-portage/* $ROOTFS/etc/portage/

      # ---------------- PROFILE ----------------
      - name: Set profile
        run: |
          ln -sf /var/db/repos/gentoo/profiles/default/linux/amd64/23.0/desktop/gnome \
            $ROOTFS/etc/portage/make.profile

      # ---------------- MAKE.CONF ----------------
      - name: make.conf
        run: |
          cat > $ROOTFS/etc/portage/make.conf <<EOF
          COMMON_FLAGS="-O2 -pipe"
          CFLAGS="\${COMMON_FLAGS}"
          CXXFLAGS="\${COMMON_FLAGS}"

          USE="wayland pipewire gnome elogind dbus X"
          ACCEPT_KEYWORDS="~amd64"
          MAKEOPTS="-j$(nproc)"

          FEATURES="buildpkg binpkg-multi-instance"
          PKGDIR="/var/cache/binpkgs"
          EOF

      # ---------------- SYNC ----------------
      - name: Sync Gentoo
        run: |
          chroot $ROOTFS emerge-webrsync

      # ---------------- SYSTEM BASE ----------------
      - name: Install base system
        run: |
          chroot $ROOTFS emerge -uDN @world

      # ---------------- GNOME ----------------
      - name: Install GNOME
        run: |
          chroot $ROOTFS emerge gnome-base/gnome gdm

      # ---------------- SERVICES ----------------
      - name: Enable services
        run: |
          chroot $ROOTFS rc-update add dbus default || true
          chroot $ROOTFS rc-update add gdm default || true

      # ---------------- KERNEL ----------------
      - name: Kernel + initramfs
        run: |
          chroot $ROOTFS emerge sys-kernel/gentoo-kernel-bin sys-kernel/dracut
          chroot $ROOTFS dracut --force

      # ---------------- ISO ROOTFS ----------------
      - name: Create ISO root
        run: |
          mkdir -p /iso/boot
          cp $ROOTFS/boot/vmlinuz-* /iso/boot/
          cp $ROOTFS/boot/initramfs* /iso/boot/

      # ---------------- ISO BUILD ----------------
      - name: Build ISO
        run: |
          xorriso -as mkisofs \
            -o /tmp/gentoo-gnome.iso \
            -b boot/limine-bios-cd.bin \
            -no-emul-boot \
            /iso

      # ---------------- ARTIFACT ----------------
      - uses: actions/upload-artifact@v4
        with:
          name: gentoo-gnome-iso
          path: /tmp/gentoo-gnome.iso
