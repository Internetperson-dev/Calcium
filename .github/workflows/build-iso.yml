name: Build Gentoo Install ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: gentoo/stage3:latest
      options: --privileged
    timeout-minutes: 360
    env:
      PKGDIR: /var/cache/binpkgs

    steps:
      - uses: actions/checkout@v4
        with:
          path: calcium

      - name: Recombine Split Files
        run: bash calcium/scripts/recombine.sh calcium

      - name: Configure Portage
        run: |
          cp -ra calcium/etc-portage/* /etc/portage/ 2>/dev/null || true
          rm -rf /etc/portage/repos.conf /etc/portage/gnupg /etc/portage/make.profile
          rm -f /etc/portage/package.use/python
          echo 'sys-apps/systemd' > /etc/portage/package.mask/systemd
          echo 'dev-libs/libelf' >> /etc/portage/package.mask/systemd
          echo 'sys-libs/zlib-ng' >> /etc/portage/package.mask/systemd
           echo '# LLVM 22+ provided by GitHub binary — block emerge from building' > /etc/portage/package.mask/llvm
           echo '>=llvm-core/llvm-22' >> /etc/portage/package.mask/llvm
           echo '>=llvm-core/llvm-common-22' >> /etc/portage/package.mask/llvm
           echo '>=llvm-core/clang-22' >> /etc/portage/package.mask/llvm
           echo '>=llvm-core/clang-common-22' >> /etc/portage/package.mask/llvm
           echo '>=llvm-core/lld-22' >> /etc/portage/package.mask/llvm
           echo '>=llvm-core/libclc-22' >> /etc/portage/package.mask/llvm
           echo '>=llvm-runtimes/compiler-rt-22' >> /etc/portage/package.mask/llvm
           echo '>=llvm-runtimes/compiler-rt-sanitizers-22' >> /etc/portage/package.mask/llvm
           echo '>=llvm-runtimes/clang-rtlib-config-22' >> /etc/portage/package.mask/llvm
           echo '>=llvm-core/llvmgold-22' >> /etc/portage/package.mask/llvm
            ln -sfn ../../var/db/repos/gentoo/profiles/default/linux/amd64/23.0/desktop /etc/portage/make.profile
           mkdir -p /tmp/portage /tmp/distfiles

      - name: Set make.conf
        run: |
          > /etc/portage/make.conf
          printf '%s\n' \
            'COMMON_FLAGS="-O2 -pipe"' \
            'CFLAGS="${COMMON_FLAGS}"' \
            'CXXFLAGS="${COMMON_FLAGS}"' \
            'FCFLAGS="${COMMON_FLAGS}"' \
            'FFLAGS="${COMMON_FLAGS}"' \
            'USE="wayland pipewire pulseaudio X flatpak elogind -systemd gnutls"' \
            'LC_MESSAGES=C.utf8' \
            'FEATURES="getbinpkg buildpkg"' \
            'PKGDIR=/var/cache/binpkgs' \
            'ACCEPT_KEYWORDS="~amd64"' \
            'ACCEPT_LICENSE="*"' \
            "MAKEOPTS=-j$(nproc)" \
            'INSTALLKERNEL_INITRD_GENERATOR="dracut"' \
            'PORTAGE_TMPDIR=/tmp/portage' \
            'DISTDIR=/tmp/distfiles' \
            'EMERGE_DEFAULT_OPTS="--usepkg --verbose --autounmask-backtrack=y --backtrack=100"' \
            >> /etc/portage/make.conf

      - name: Sync Portage Tree
        run: |
          emerge-webrsync
          # Overwrite repos.conf with git-based gentoo repo + overlays
          # (webrsync may not create repos.conf in newer portage versions)
          cat calcium/etc-portage/repos.conf/gentoo.conf > /etc/portage/repos.conf
          cat calcium/etc-portage/repos.conf/eselect-repo.conf >> /etc/portage/repos.conf
          # Don't sync overlays yet - git isn't installed. Done after Install System Base.

      - name: Restore binary cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/binpkgs-cache.7z
          key: binpkgs-full-${{ hashFiles('calcium/world', 'calcium/etc-portage/package.use/*', 'calcium/etc-portage/package.mask/*') }}
          restore-keys: |
            binpkgs-
      - name: Decompress cached binaries
        run: |
          if [ -f /tmp/binpkgs-cache.7z ]; then
            echo "Cache hit — decompressing..."
            if ! command -v 7z &>/dev/null; then
              emerge -q app-arch/7zip
            fi
            7z x /tmp/binpkgs-cache.7z -o/ -y
            ls /var/cache/binpkgs/ | head -10
          else
            echo "No cache found — starting fresh"
          fi

      - name: Pre-configure autounmask USE changes
        run: |
          # abi_x86_32 is globally masked via profile/package.use.mask/no-multilib,
          # so portage will not attempt 32-bit builds even if the desktop profile
          # forces abi_x86_32 on individual packages.
          # Break circular deps. Separate files so autounmask doesn't overwrite them:
          echo 'media-video/ffmpeg -sdl' > /etc/portage/package.use/zz-circular-dep-break
          echo 'dev-python/pillow -truetype' > /etc/portage/package.use/custom-no-truetype
          echo 'media-libs/tiff -webp' > /etc/portage/package.use/zz-tiff-no-webp

      - name: Install LLVM + Clang from GitHub binary
        run: |
          VERSION="22.1.7"
          URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${VERSION}/LLVM-${VERSION}-Linux-X64.tar.xz"
          echo "Downloading LLVM ${VERSION} prebuilt binary from GitHub..."
          wget -O /tmp/llvm.tar.xz "$URL"
          tar xf /tmp/llvm.tar.xz -C /usr --strip-components=1
          ldconfig
          SLOT="22"
          for pkg in \
            llvm-core/llvm \
            llvm-core/llvm-common \
            llvm-core/clang \
            llvm-core/clang-common \
            llvm-core/lld \
            llvm-runtimes/compiler-rt \
            llvm-runtimes/compiler-rt-sanitizers \
            llvm-runtimes/clang-rtlib-config \
            llvm-core/libclc \
          ; do
            cat="${pkg%%/*}"
            name="${pkg#*/}"
            db="/var/db/pkg/${pkg}-${VERSION}"
            mkdir -p "$db"
            echo "$cat" > "$db/CATEGORY"
            echo "${name}-${VERSION}" > "$db/PF"
            echo "$SLOT" > "$db/SLOT"
            echo "8" > "$db/EAPI"
            echo "~amd64" > "$db/KEYWORDS"
            touch "$db/DEPEND" "$db/RDEPEND"
            # llvm needs binutils-plugin USE to satisfy llvmgold dependency
            if [ "$pkg" = "llvm-core/llvm" ]; then
              echo "binutils-plugin" > "$db/USE"
            else
              touch "$db/USE"
            fi
          done
          # llvmgold is version 22 with SLOT 0, not 22.1.7
          VGOLD="22"
          db="/var/db/pkg/llvm-core/llvmgold-${VGOLD}"
          mkdir -p "$db"
          echo "llvm-core" > "$db/CATEGORY"
          echo "llvmgold-${VGOLD}" > "$db/PF"
          echo "0" > "$db/SLOT"
          echo "8" > "$db/EAPI"
          echo "~amd64" > "$db/KEYWORDS"
          touch "$db/DEPEND" "$db/RDEPEND" "$db/USE"
          echo "Installed LLVM + sub-packages ${VERSION} from GitHub binary"

      - name: Install System Base
        run: |
          PACKAGES="dev-libs/libxml2 net-misc/curl sys-kernel/gentoo-kernel-bin sys-kernel/linux-firmware sys-kernel/dracut sys-boot/limine dev-libs/libisoburn sys-auth/elogind app-shells/zsh dev-vcs/git app-arch/7zip"
          for i in 1 2 3 4 5; do
            emerge --autounmask-write -q --usepkg-exclude 'virtual/libelf' $PACKAGES && break
            echo "Autounmask pass $i done, merging changes and retrying..."
            find /etc/portage -name '._cfg*' -exec sh -c 'cat "$1" > "$(dirname "$1")/$(basename "$1" | sed "s/^\._cfg[0-9]*_//")" && rm -f "$1"' _ {} \;
          done
          emerge -q --autounmask=n --usepkg-exclude 'virtual/libelf' $PACKAGES

      - name: Compress and save cache (after base)
        run: 7z a -mx=1 /tmp/binpkgs-cache.7z /var/cache/binpkgs/ -y
      - uses: actions/cache/save@v4
        with:
          path: /tmp/binpkgs-cache.7z
          key: binpkgs-base-${{ hashFiles('calcium/world', 'calcium/etc-portage/package.use/*', 'calcium/etc-portage/package.mask/*') }}

      - name: Sync Overlays
        run: |
          # git is now installed, so emaint can clone overlay repos
          for repo in guru CachyOS-kernels hyproverlay pingwho-overlay arrans-overlay; do
            echo "Syncing overlay: $repo"
            emaint sync --repo "$repo" || true
          done

      - name: Deploy World File
        run: |
          cp calcium/world /var/lib/portage/world
          echo "Deployed world file with $(wc -l < /var/lib/portage/world) packages"

      - name: Install Flutter (checkpoint)
        run: |
          for i in 1 2 3 4 5; do
            emerge --autounmask-write -q dev-lang/flutter-bin && break
            echo "Autounmask pass $i done, merging changes and retrying..."
            find /etc/portage -name '._cfg*' -exec sh -c 'cat "$1" > "$(dirname "$1")/$(basename "$1" | sed "s/^\._cfg[0-9]*_//")" && rm -f "$1"' _ {} \;
          done
          emerge -q --autounmask=n dev-lang/flutter-bin

      - name: Compress and save cache (after Flutter)
        run: 7z a -mx=1 /tmp/binpkgs-cache.7z /var/cache/binpkgs/ -y
      - uses: actions/cache/save@v4
        with:
          path: /tmp/binpkgs-cache.7z
          key: binpkgs-flutter-${{ hashFiles('calcium/world', 'calcium/etc-portage/package.use/*', 'calcium/etc-portage/package.mask/*') }}

      - name: Install binary gcc from binhost
        run: |
          emerge --usepkgonly -1q sys-devel/gcc 2>/dev/null && echo "gcc installed from binary" || echo "No binary gcc, will use stage3 version"

      - name: Compress and save cache (after toolchain)
        run: 7z a -mx=1 /tmp/binpkgs-cache.7z /var/cache/binpkgs/ -y
      - uses: actions/cache/save@v4
        with:
          path: /tmp/binpkgs-cache.7z
          key: binpkgs-toolchain-${{ hashFiles('calcium/world', 'calcium/etc-portage/package.use/*', 'calcium/etc-portage/package.mask/*') }}

      - name: Install World Packages
        run: |
          for i in 1 2 3 4 5; do
            emerge --autounmask-write --with-bdeps=y --usepkg-exclude 'virtual/libelf' @world && break
            echo "Autounmask pass $i done, merging changes and retrying..."
            find /etc/portage -name '._cfg*' -exec sh -c 'cat "$1" > "$(dirname "$1")/$(basename "$1" | sed "s/^\._cfg[0-9]*_//")" && rm -f "$1"' _ {} \;
          done
          emerge --with-bdeps=y --autounmask=n --usepkg-exclude 'virtual/libelf' @world

      - name: Compress and save cache (after world)
        run: 7z a -mx=1 /tmp/binpkgs-cache.7z /var/cache/binpkgs/ -y
      - uses: actions/cache/save@v4
        with:
          path: /tmp/binpkgs-cache.7z
          key: binpkgs-world-${{ hashFiles('calcium/world', 'calcium/etc-portage/package.use/*', 'calcium/etc-portage/package.mask/*') }}

      - name: Install Hyprland
        run: |
          for i in 1 2 3 4 5; do
            emerge --autounmask-write -q gui-wm/hyprland && break
            echo "Autounmask pass $i done, merging changes and retrying..."
            find /etc/portage -name '._cfg*' -exec sh -c 'cat "$1" > "$(dirname "$1")/$(basename "$1" | sed "s/^\._cfg[0-9]*_//")" && rm -f "$1"' _ {} \;
          done
          emerge -q --autounmask=n gui-wm/hyprland

      - name: Install NVIDIA Drivers
        run: |
          for i in 1 2 3 4 5; do
            emerge --autounmask-write -q x11-drivers/nvidia-drivers && break
            echo "Autounmask pass $i done, merging changes and retrying..."
            find /etc/portage -name '._cfg*' -exec sh -c 'cat "$1" > "$(dirname "$1")/$(basename "$1" | sed "s/^\._cfg[0-9]*_//")" && rm -f "$1"' _ {} \;
          done
          emerge -q --autounmask=n x11-drivers/nvidia-drivers

      - name: Compress and save cache (after nvidia)
        run: 7z a -mx=1 /tmp/binpkgs-cache.7z /var/cache/binpkgs/ -y
      - uses: actions/cache/save@v4
        with:
          path: /tmp/binpkgs-cache.7z
          key: binpkgs-nvidia-${{ hashFiles('calcium/world', 'calcium/etc-portage/package.use/*', 'calcium/etc-portage/package.mask/*') }}

      - name: Create NVIDIA Dracut Config
        run: |
          mkdir -p /etc/dracut.conf.d
          printf '%s\n' \
            '# Include NVIDIA modules in initramfs for early KMS' \
            'force_drivers+=" nvidia nvidia_modeset nvidia_drm nvidia_uvm "' \
            'install_items+=" /etc/modprobe.d/nvidia.conf "' \
            > /etc/dracut.conf.d/nvidia.conf
          mkdir -p /etc/modprobe.d
          printf '%s\n' \
            '# NVIDIA DRM modesetting for Wayland' \
            'options nvidia_drm modeset=1 fbdev=0' \
            'options nvidia NVreg_DynamicPowerManagement=0x02' \
            'options nvidia NVreg_PreserveVideoMemoryAllocations=1' \
            > /etc/modprobe.d/nvidia.conf

      - name: Build Initramfs
        run: |
          KVER=$(ls -1 /lib/modules/ | sort -V | tail -1)
          echo "Building initramfs for kernel: $KVER"
          dracut --kver "$KVER" --force --zstd --host-only \
            --add bash \
            --force-drivers "nvidia nvidia_modeset nvidia_drm nvidia_uvm" \
            --ro-mnt /boot/initramfs.img

      - name: Deploy System Configurations
        run: |
          cp calcium/.zshrc /root/.zshrc
          mkdir -p /root/.config
          cp -ra calcium/.config/zsh /root/.config/ 2>/dev/null || true
          cp -ra calcium/.config/hypr /root/.config/ 2>/dev/null || true
          cp -ra calcium/.config/hyprlock /root/.config/ 2>/dev/null || true
          cp -ra calcium/.config/waybar /root/.config/ 2>/dev/null || true
          cp -ra calcium/.config/mako /root/.config/ 2>/dev/null || true
          cp -ra calcium/.config/foot /root/.config/ 2>/dev/null || true
          cp -ra calcium/.config/gtk-3.0 /root/.config/ 2>/dev/null || true
          cp -ra calcium/.config/gtk-4.0 /root/.config/ 2>/dev/null || true
          cp -ra calcium/.config/openbox /root/.config/ 2>/dev/null || true
          cp -ra calcium/.config/labwc /root/.config/ 2>/dev/null || true
          cp calcium/etc/doas.conf /etc/doas.conf 2>/dev/null || true
          cp -ra calcium/etc/elogind/* /etc/elogind/ 2>/dev/null || true
          cp calcium/scripts/systemstart-hypr /root/ 2>/dev/null || true
          cp calcium/scripts/amd-thermal-throttle.py /root/ 2>/dev/null || true
          cp calcium/scripts/post-install-apps.sh /root/ 2>/dev/null || true
          chsh -s /bin/zsh

      - name: Assemble Bootable ISO
        run: |
          KVER=$(ls -1 /lib/modules/ | sort -V | tail -1)
          mkdir -p /iso-root/boot /iso-root/EFI/BOOT

          cp /boot/vmlinuz-* /iso-root/boot/
          cp /boot/initramfs* /iso-root/boot/
          cp calcium/boot-6-15-7/amd-uc.img /iso-root/boot/ 2>/dev/null || true

          cp /usr/share/limine/limine-bios-cd.bin /iso-root/
          cp /usr/share/limine/limine-bios.sys /iso-root/
          cp /usr/share/limine/BOOTX64.EFI /iso-root/EFI/BOOT/
          cp /usr/share/limine/limine-uefi-cd.bin /iso-root/

          bash calcium/scripts/generate-limine-cfg.sh "$KVER" /iso-root/limine.cfg

          xorriso -as mkisofs -b limine-bios-cd.bin \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            --efi-boot limine-uefi-cd.bin \
            -efi-boot-part --efi-boot-image --protective-msdos-label \
            /iso-root -o /tmp/gentoo-custom-install.iso

          limine bios-install /tmp/gentoo-custom-install.iso

      - name: Verify ISO
        run: |
          ls -lh /tmp/gentoo-custom-install.iso
          file /tmp/gentoo-custom-install.iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gentoo-custom-install-amd64
          path: /tmp/gentoo-custom-install.iso
          retention-days: 30
          compression-level: 0

