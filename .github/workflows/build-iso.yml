name: Build Gentoo Install ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: gentoo/stage3:latest
      options: --privileged
    timeout-minutes: 360

    env:
      PKGDIR: /var/cache/binpkgs

    steps:
      - uses: actions/checkout@v4
        with:
          path: calcium

      - name: Recombine Split Files
        run: bash calcium/scripts/recombine.sh calcium

      # ---------------- PORTAGE CONFIG ----------------
      - name: Configure Portage
        run: |
          cp -ra calcium/etc-portage/* /etc/portage/ 2>/dev/null || true

          rm -rf /etc/portage/repos.conf /etc/portage/gnupg /etc/portage/make.profile
          rm -f /etc/portage/package.use/python

          echo 'sys-apps/systemd' > /etc/portage/package.mask/systemd
          echo 'dev-libs/libelf' >> /etc/portage/package.mask/systemd
          echo 'sys-libs/zlib-ng' >> /etc/portage/package.mask/systemd

          # LLVM mask — block emerge from building any LLVM 21+ (provided by GitHub binary)
          echo '# LLVM 21+ provided by GitHub binary — block emerge from building' > /etc/portage/package.mask/llvm
          echo '>=llvm-core/llvm-21' >> /etc/portage/package.mask/llvm
          echo '>=llvm-core/llvm-common-21' >> /etc/portage/package.mask/llvm
          echo '>=llvm-core/clang-21' >> /etc/portage/package.mask/llvm
          echo '>=llvm-core/clang-common-21' >> /etc/portage/package.mask/llvm
          echo '>=llvm-core/lld-21' >> /etc/portage/package.mask/llvm
          echo '>=llvm-core/libclc-21' >> /etc/portage/package.mask/llvm
          echo '>=llvm-runtimes/compiler-rt-21' >> /etc/portage/package.mask/llvm
          echo '>=llvm-runtimes/compiler-rt-sanitizers-21' >> /etc/portage/package.mask/llvm
          echo '>=llvm-runtimes/clang-rtlib-config-21' >> /etc/portage/package.mask/llvm
          echo '>=llvm-core/llvmgold-21' >> /etc/portage/package.mask/llvm

          ln -sfn ../../var/db/repos/gentoo/profiles/default/linux/amd64/23.0/desktop /etc/portage/make.profile

          mkdir -p /tmp/portage /tmp/distfiles

      # ---------------- MAKE.CONF ----------------
      - name: Set make.conf
        run: |
          > /etc/portage/make.conf
          printf '%s\n' \
            'COMMON_FLAGS="-O2 -pipe"' \
            'CFLAGS="${COMMON_FLAGS}"' \
            'CXXFLAGS="${COMMON_FLAGS}"' \
            'USE="wayland pipewire pulseaudio X flatpak elogind -systemd gnutls"' \
            'LC_MESSAGES=C.utf8' \
            'FEATURES="getbinpkg buildpkg binpkg-multi-instance"' \
            'PKGDIR=/var/cache/binpkgs' \
            'ACCEPT_KEYWORDS="~amd64"' \
            'ACCEPT_LICENSE="*"' \
            "MAKEOPTS=\"-j$(nproc) -l$(nproc)\"" \
            'INSTALLKERNEL_INITRD_GENERATOR="dracut"' \
            'PORTAGE_TMPDIR=/tmp/portage' \
            'DISTDIR=/tmp/distfiles' \
            'EMERGE_DEFAULT_OPTS="--usepkg --verbose --autounmask-backtrack=y --backtrack=100"' \
            >> /etc/portage/make.conf

      # ---------------- SYNC ----------------
      - name: Sync Portage Tree
        run: |
          emerge-webrsync
          cat calcium/etc-portage/repos.conf/gentoo.conf > /etc/portage/repos.conf
          cat calcium/etc-portage/repos.conf/eselect-repo.conf >> /etc/portage/repos.conf

      # ---------------- CACHE RESTORE ----------------
      - name: Restore best binpkg snapshot
        uses: actions/cache/restore@v4
        with:
          path: /tmp/binpkgs-cache.tar.zst
          key: binpkgs-final-${{ hashFiles('calcium/world', 'calcium/etc-portage/package.use/*', 'calcium/etc-portage/package.mask/*') }}
          restore-keys: |
            binpkgs-world-
            binpkgs-system-
            binpkgs-

      - name: Extract binpkg cache
        run: |
          if [ -f /tmp/binpkgs-cache.tar.zst ]; then
            echo "Restoring binary package cache..."
            emerge -q app-arch/zstd || true
            tar -I zstd -xf /tmp/binpkgs-cache.tar.zst -C /
          else
            echo "No cache found"
          fi

      # ---------------- PRE-CONFIGURE AUTOMASK ----------------
      - name: Pre-configure autounmask USE changes
        run: |
          echo 'media-video/ffmpeg -sdl' > /etc/portage/package.use/zz-circular-dep-break
          echo 'dev-python/pillow -truetype' > /etc/portage/package.use/custom-no-truetype
          echo 'media-libs/tiff -webp' > /etc/portage/package.use/zz-tiff-no-webp

      # ---------------- LLVM BINARY ----------------
      - name: Install LLVM + Clang from GitHub binary
        run: |
          VERSION="22.1.7"
          URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${VERSION}/LLVM-${VERSION}-Linux-X64.tar.xz"
          echo "Downloading LLVM ${VERSION} prebuilt binary from GitHub..."
          wget -O /tmp/llvm.tar.xz "$URL"
          tar xf /tmp/llvm.tar.xz -C /usr --strip-components=1
          ldconfig

          # Fake portage db entries for LLVM 22
          SLOT="22"
          for pkg in \
            llvm-core/llvm \
            llvm-core/llvm-common \
            llvm-core/clang \
            llvm-core/clang-common \
            llvm-core/lld \
            llvm-runtimes/compiler-rt \
            llvm-runtimes/compiler-rt-sanitizers \
            llvm-runtimes/clang-rtlib-config \
            llvm-core/libclc \
          ; do
            cat="${pkg%%/*}"
            name="${pkg#*/}"
            db="/var/db/pkg/${pkg}-${VERSION}"
            mkdir -p "$db"
            echo "$cat" > "$db/CATEGORY"
            echo "${name}-${VERSION}" > "$db/PF"
            echo "$SLOT" > "$db/SLOT"
            echo "8" > "$db/EAPI"
            echo "~amd64" > "$db/KEYWORDS"
            touch "$db/DEPEND" "$db/RDEPEND"
            if [ "$pkg" = "llvm-core/llvm" ]; then
              echo "binutils-plugin" > "$db/USE"
            else
              touch "$db/USE"
            fi
          done

          # llvmgold — version 22, SLOT 0
          VGOLD="22"
          db="/var/db/pkg/llvm-core/llvmgold-${VGOLD}"
          mkdir -p "$db"
          echo "llvm-core" > "$db/CATEGORY"
          echo "llvmgold-${VGOLD}" > "$db/PF"
          echo "0" > "$db/SLOT"
          echo "8" > "$db/EAPI"
          echo "~amd64" > "$db/KEYWORDS"
          touch "$db/DEPEND" "$db/RDEPEND" "$db/USE"

          # Fake LLVM 21 entries — prevents pulling in binhost LLVM 21
          VERSION_LLVM21="21.99"
          SLOT_LLVM21="21"
          for pkg in \
            llvm-core/llvm \
            llvm-core/llvm-common \
            llvm-core/clang \
            llvm-core/clang-common \
            llvm-core/lld \
            llvm-runtimes/compiler-rt \
            llvm-runtimes/compiler-rt-sanitizers \
            llvm-runtimes/clang-rtlib-config \
            llvm-core/libclc \
          ; do
            cat="${pkg%%/*}"
            name="${pkg#*/}"
            db="/var/db/pkg/${pkg}-${VERSION_LLVM21}"
            mkdir -p "$db"
            echo "$cat" > "$db/CATEGORY"
            echo "${name}-${VERSION_LLVM21}" > "$db/PF"
            echo "$SLOT_LLVM21" > "$db/SLOT"
            echo "8" > "$db/EAPI"
            echo "~amd64" > "$db/KEYWORDS"
            touch "$db/DEPEND" "$db/RDEPEND"
            if [ "$pkg" = "llvm-core/llvm" ]; then
              echo "binutils-plugin" > "$db/USE"
            else
              touch "$db/USE"
            fi
          done

          echo "Installed LLVM ${VERSION} from GitHub binary with fake db entries"

      # ---------------- LIBXML2 (for ld.lld) ----------------
      - name: Install libxml2 (so ld.lld finds it)
        run: |
          emerge -q dev-libs/libxml2
          ldconfig

      # ---------------- SYSTEM BASE ----------------
      - name: Install System Base
        run: |
          PACKAGES="net-misc/curl sys-kernel/gentoo-kernel-bin sys-kernel/linux-firmware sys-kernel/dracut sys-boot/limine dev-libs/libisoburn sys-auth/elogind app-shells/zsh dev-vcs/git app-arch/7zip"

          for i in 1 2 3 4 5; do
            emerge --autounmask-write --usepkg --usepkg-exclude 'virtual/libelf' $PACKAGES && break
            find /etc/portage -name '._cfg*' -exec sh -c '
              cat "$1" > "$(dirname "$1")/$(basename "$1" | sed "s/^\._cfg[0-9]*_//")"
              rm -f "$1"
            ' _ {} \;
          done

          emerge --autounmask=n --usepkg --usepkg-exclude 'virtual/libelf' $PACKAGES

      # ---------------- SNAPSHOT #1 ----------------
      - name: Snapshot binpkgs (system base)
        run: |
          tar -I 'zstd -1' -cf /tmp/binpkgs-system.tar.zst /var/cache/binpkgs

      - uses: actions/cache/save@v4
        with:
          path: /tmp/binpkgs-system.tar.zst
          key: binpkgs-system-${{ hashFiles('calcium/world', 'calcium/etc-portage/package.use/*', 'calcium/etc-portage/package.mask/*') }}

      # ---------------- SYNC OVERLAYS ----------------
      - name: Sync Overlays
        run: |
          for repo in guru CachyOS-kernels hyproverlay pingwho-overlay arrans-overlay; do
            echo "Syncing overlay: $repo"
            emaint sync --repo "$repo" || true
          done

      # ---------------- WORLD FILE ----------------
      - name: Deploy World File
        run: |
          cp calcium/world /var/lib/portage/world

      # ---------------- FLUTTER ----------------
      - name: Install Flutter
        run: |
          for i in 1 2 3 4 5; do
            emerge --autounmask-write -q dev-lang/flutter-bin && break
            find /etc/portage -name '._cfg*' -exec sh -c '
              cat "$1" > "$(dirname "$1")/$(basename "$1" | sed "s/^\._cfg[0-9]*_//")"
              rm -f "$1"
            ' _ {} \;
          done
          emerge -q --autounmask=n dev-lang/flutter-bin

      # ---------------- BINARY GCC ----------------
      - name: Install binary gcc from binhost
        run: |
          emerge --usepkgonly -1q sys-devel/gcc 2>/dev/null && echo "gcc installed from binary" || echo "No binary gcc, will use stage3 version"

      # ---------------- WORLD ----------------
      - name: Install World Packages
        run: |
          for i in 1 2 3 4 5; do
            emerge --autounmask-write --with-bdeps=y --usepkg --usepkg-exclude 'virtual/libelf' @world && break
            find /etc/portage -name '._cfg*' -exec sh -c '
              cat "$1" > "$(dirname "$1")/$(basename "$1" | sed "s/^\._cfg[0-9]*_//")"
              rm -f "$1"
            ' _ {} \;
          done

          emerge --with-bdeps=y --autounmask=n --usepkg --usepkg-exclude 'virtual/libelf' @world

      # ---------------- SNAPSHOT #2 ----------------
      - name: Snapshot binpkgs (world)
        run: |
          tar -I 'zstd -1' -cf /tmp/binpkgs-world.tar.zst /var/cache/binpkgs

      - uses: actions/cache/save@v4
        with:
          path: /tmp/binpkgs-world.tar.zst
          key: binpkgs-world-${{ hashFiles('calcium/world', 'calcium/etc-portage/package.use/*', 'calcium/etc-portage/package.mask/*') }}

      # ---------------- HYPRLAND ----------------
      - name: Install Hyprland
        run: |
          for i in 1 2 3 4 5; do
            emerge --autounmask-write -q gui-wm/hyprland && break
            find /etc/portage -name '._cfg*' -exec sh -c '
              cat "$1" > "$(dirname "$1")/$(basename "$1" | sed "s/^\._cfg[0-9]*_//")"
              rm -f "$1"
            ' _ {} \;
          done
          emerge -q --autounmask=n gui-wm/hyprland

      # ---------------- NVIDIA ----------------
      - name: Install NVIDIA Drivers
        run: |
          for i in 1 2 3 4 5; do
            emerge --autounmask-write -q x11-drivers/nvidia-drivers && break
            find /etc/portage -name '._cfg*' -exec sh -c '
              cat "$1" > "$(dirname "$1")/$(basename "$1" | sed "s/^\._cfg[0-9]*_//")"
              rm -f "$1"
            ' _ {} \;
          done
          emerge -q --autounmask=n x11-drivers/nvidia-drivers

      # ---------------- FINAL SNAPSHOT ----------------
      - name: Snapshot binpkgs (final)
        run: |
          tar -I 'zstd -1' -cf /tmp/binpkgs-final.tar.zst /var/cache/binpkgs

      - uses: actions/cache/save@v4
        with:
          path: /tmp/binpkgs-final.tar.zst
          key: binpkgs-final-${{ hashFiles('calcium/world', 'calcium/etc-portage/package.use/*', 'calcium/etc-portage/package.mask/*') }}

      # ---------------- DRACUT ----------------
      - name: Configure NVIDIA initramfs
        run: |
          mkdir -p /etc/dracut.conf.d
          printf '%s\n' \
            'force_drivers+=" nvidia nvidia_modeset nvidia_drm nvidia_uvm "' \
            'install_items+=" /etc/modprobe.d/nvidia.conf "' \
            > /etc/dracut.conf.d/nvidia.conf

          mkdir -p /etc/modprobe.d
          printf '%s\n' \
            'options nvidia_drm modeset=1 fbdev=0' \
            'options nvidia NVreg_DynamicPowerManagement=0x02' \
            'options nvidia NVreg_PreserveVideoMemoryAllocations=1' \
            > /etc/modprobe.d/nvidia.conf

      - name: Build Initramfs
        run: |
          KVER=$(ls /lib/modules | sort -V | tail -1)

          dracut --kver "$KVER" --force --zstd --host-only \
            --add bash \
            --force-drivers "nvidia nvidia_modeset nvidia_drm nvidia_uvm" \
            /boot/initramfs.img

      # ---------------- ISO BUILD ----------------
      - name: Assemble ISO
        run: |
          KVER=$(ls /lib/modules | sort -V | tail -1)

          mkdir -p /iso-root/boot /iso-root/EFI/BOOT

          cp /boot/vmlinuz-* /iso-root/boot/
          cp /boot/initramfs* /iso-root/boot/
          cp calcium/boot-6-15-7/amd-uc.img /iso-root/boot/ 2>/dev/null || true

          cp /usr/share/limine/limine-bios-cd.bin /iso-root/
          cp /usr/share/limine/limine-bios.sys /iso-root/
          cp /usr/share/limine/BOOTX64.EFI /iso-root/EFI/BOOT/
          cp /usr/share/limine/limine-uefi-cd.bin /iso-root/

          bash calcium/scripts/generate-limine-cfg.sh "$KVER" /iso-root/limine.cfg

          xorriso -as mkisofs \
            -b limine-bios-cd.bin \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            --efi-boot limine-uefi-cd.bin \
            -efi-boot-part --efi-boot-image --protective-msdos-label \
            /iso-root -o /tmp/gentoo-custom-install.iso

          limine bios-install /tmp/gentoo-custom-install.iso

      # ---------------- VERIFY ----------------
      - name: Verify ISO
        run: |
          ls -lh /tmp/gentoo-custom-install.iso
          file /tmp/gentoo-custom-install.iso

      # ---------------- ARTIFACT ----------------
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: gentoo-custom-install-amd64
          path: /tmp/gentoo-custom-install.iso
          retention-days: 30
          compression-level: 0
