# ---------------- BOTTOM ROW ----------------

# 24 hour time
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(216,222,233,0.7)
    font_size = 110
    font_family = SF Pro Display Bold
    position = 0, 500       # moved lower to avoid overlap
    halign = center
    valign = bottom
}

# Password Input
input-field {
    monitor =
    size = 320, 60
    outline_thickness = 2

    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgba(0,0,0,0)
    inner_color = rgba(255,255,255,0.1)
    font_color = rgb(200,200,200)

    fade_on_empty = false
    font_family = SF Pro Display Bold

    placeholder_text = 🔒 Enter Password
    hide_input = false

    position = 0, 150
    halign = center
    valign = bottom
}

# USER-BOX
shape {
    monitor =
    size = 300, 60
    color = rgba(255, 255, 255, .1)
    rounding = -1
    border_size = 0
    border_color = rgba(253, 198, 135, 0)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)

    position = 0, -180      # moved higher to prevent overlap
    halign = center
    valign = center
}

# User
label {
    monitor =
    text =   $USER
    color = rgba(216,222,233,0.8)
    font_size = 18
    font_family = SF Pro Display Bold
    position = 0, -180      # match user-box
    halign = center
    valign = center
}

# ---------------- POWER BUTTONS ----------------

# Reboot
label {
    monitor =
    text = Reboot
    font_size = 20
    color = rgba(255,255,255,0.7)
    onclick = reboot
    position = -120, 50
    halign = center
    valign = bottom
}

# Power Off
label {
    monitor =
    text = Power Off
    font_size = 20
    color = rgba(255,255,255,0.7)
    onclick = shutdown now
    position = 0, 50
    halign = center
    valign = bottom
}

