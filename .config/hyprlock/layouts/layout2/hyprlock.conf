# BACKGROUND
background {
    monitor =
    path = /home/ram/.config/RamOS/Wallpapers/wallpaper.png
    blur_passes = 3
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# ---------------- TOP ROW ----------------
label {
    monitor =
    text = cmd[update:1000] date +"%Y-%m-%d"
    color = rgba(216,222,233,0.7)
    font_size = 25
    font_family = SF Pro Display Bold
    position = 0, -120
    halign = center
    valign = top
}

