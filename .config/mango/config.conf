# Mangowm Configuration - Migrated from Hyprland
# https://mangowm.github.io/docs/

#######################
### ENVIRONMENT     ###
#######################

env=XCURSOR_SIZE,24
env=HYPRCURSOR_SIZE,24
env=HYPRCURSOR_THEME,Bibata-Modern-Ice
env=XCURSOR_THEME,Adwaita

# Wayland specific
env=OZONE_PLATFORM,wayland
env=XDG_SESSION_TYPE,wayland
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=MOZ_ENABLE_WAYLAND,1

# Nvidia Support
env=LIBVA_DRIVER_NAME,nvidia
env=__GLX_VENDOR_LIBRARY_NAME,nvidia
env=ELECTRON_OZONE_PLATFORM_HINT,auto

# Qt theming
env=QT_QPA_PLATFORMTHEME,qt6ct

###################
### GENERAL      ###
###################

# Gaps
gaps_inner=1
gaps_outer=5

# Borders
borderpx=2
focuscolor=0x33ccffee
unfocuscolor=0x595959aa

# Window layout
layout_default=tile

# Misc
blur=0
shadows=1
shadow_blur=15
shadow_color=0x1a1a1aee
border_radius=10

# Opacity
focused_opacity=1.0
unfocused_opacity=1.0

# Rounding
rounding=10

###################
### ANIMATIONS   ###
###################

animations=1
animation_type_open=slide
animation_type_close=slide
animation_duration_open=400
animation_duration_close=300

###################
### INPUT       ###
###################

# Keyboard
repeat_rate=25
repeat_delay=600

# Touchpad
tap_to_click=1
mouse_natural_scrolling=0

# Follow mouse
follow_mouse=1

###################
### AUTOSTART   ###
###################

exec=on_start
# Note: Mangowm uses exec= for autostart (not exec-once=)
# Programs to start on boot - these are migrated from Hyprland exec-once

exec=syncthing -no-console -no-browser
exec=pactl set-card-app-profile alsa_card.pci-0000_09_00.1 output:hdmi-stereo-extra1
exec=cursor-clip --daemon
exec=mako
exec=clip-board-sync
exec=sunshine.AppImage
exec=sh -c 'for f in ~/.local/appimage/*; do ln -sf "$f" ~/.local/bin/; done'
exec=st nvidia-semi
exec=gsettings set org.gnome.desktop.interface color-scheme prefer-dark
exec=swaybg -i .config/RamOS/Wallpapers/wallpaper.png
exec=gsettings set org.gnome.desktop.interface cursor-theme Bibata-Modern-Ice
exec=sh -c 'while true; do pgrep -x sfwbar || sfwbar; sleep 5; done'
exec=hypridle
exec=desktop

###################
### WINDOWRULES ###
###################

# XWayland no initial focus
windowrule=no_initial_focus,appid:xwayland

# Steam Big Picture - float and fullscreen
windowrule=fullscreen,appid:^Steam$
windowrule=float,appid:^Steam$

# Alacritty opacity
windowrule=opacity:0.99 0.99,appid:^(Alacritty|st)$

# Default floating
windowrule=float,class:.*

# Tag rules (workspace layout)
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile

###################
### KEYBINDINGS ###
###################

keymode=default

# Terminal
bind=SUPER,Return,spawn,alacritty

# Kill active
bind=SUPER,q,killclient

# File manager
bind=SUPER,r,spawn,st lf

# Float toggle
bind=SUPER,v,togglefloat

# Audio mixer
bind=SUPER,m,spawn,st pulsemixer

# Lock screen
bind=SUPER,l,spawn,sh -c 'songdetail.sh; hyprlock -c ~/.config/hyprlock/layouts/layout2/hyprlock.conf'

# Settings
bind=SUPER,F1,spawn,st python3.14 ~/.local/bin/RamOS/settings.py

# Browser
bind=SUPER,w,spawn,st librewolf-bin

# Terminal/btop
bind=SUPER,h,spawn,st btop

# Screenshot
bind=,Print,spawn,~/.local/bin/screenshot
bind=SHIFT,Print,spawn,~/.local/bin/screenshotre

# Clipboard
bind=SUPER,comma,spawn,~/.local/src/cursor-clip/target/release/cursor-clip

# Fullscreen
bind=SUPER,f,fullscreen

# Alt-Tab
bind=ALT,Tab,focusstack,next

# Focus movement
bind=SUPER,left,focusleft
bind=SUPER,right,focusright
bind=SUPER,up,focusup
bind=SUPER,down,focusdown

# Workspaces (tags)
bind=SUPER,1,viewtag,1
bind=SUPER,2,viewtag,2
bind=SUPER,3,viewtag,3
bind=SUPER,4,viewtag,4

# Move window to workspace
bind=SUPER+SHIFT,1,movetag,1
bind=SUPER+SHIFT,2,movetag,2
bind=SUPER+SHIFT,3,movetag,3
bind=SUPER+SHIFT,4,movetag,4
bind=SUPER+SHIFT,5,movetag,5
bind=SUPER+SHIFT,6,movetag,6
bind=SUPER+SHIFT,7,movetag,7
bind=SUPER+SHIFT,8,movetag,8
bind=SUPER+SHIFT,9,movetag,9
bind=SUPER+SHIFT,0,movetag,10

# Special workspace
bind=SUPER+SHIFT,s,movetag,special:magic

# Workspace scroll
bind=SUPER,btn_down,viewnext
bind=SUPER,btn_up,viewprev

# Mouse bindings for window resizing/moving
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Media keys - Volume
bindl=,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindl=,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
bindl=,XF86MonBrightnessUp,spawn,brightnessctl -e4 -n2 set 5%+
bindl=,XF86MonBrightnessDown,spawn,brightnessctl -e4 -n2 set 5%-

# Player controls
bindl=,XF86AudioNext,spawn,playerctl next
bindl=,XF86AudioPause,spawn,playerctl play-pause
bindl=,XF86AudioPlay,spawn,playerctl play-pause
bindl=,XF86AudioPrev,spawn,playerctl previous

# Reload config
bind=SUPER,r,reload_config

# Quit
bind=SUPER+SHIFT,q,quit

###################
### COMMON     ###
###################

keymode=common
bind=SUPER,r,reload_config

###################
### LAYERS     ###
###################

# Layer rules (for notifications, etc.)