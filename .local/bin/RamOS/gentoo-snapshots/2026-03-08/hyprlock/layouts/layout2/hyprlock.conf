# BACKGROUND
background {
    monitor =
    path = /home/ram/.config/RamOS/Wallpapers/wallpaper.png
    blur_passes = 3
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# --- TOP ROW (Date) ---
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%Y-%m-%d")"
    color = rgba(216, 222, 233, 0.70)
    font_size = 25
    font_family = SF Pro Display Bold
    position = 0, -300   # Top row
    halign = center
    valign = top
}

# --- MIDDLE ROW (Album Art + Song Info + User) ---
# Album Art (middle-left)
image {
    path = /home/ram/.config/hyprlock/layouts/layout2/Scripts/nowplaying/album_art.jpg
    size = 180
    rounding = 12
    position = -250, 0   # Middle row, left column
    halign = center
    valign = center
}

# Current Song + Artist (middle-center)
label {
    monitor =
    text = cmd[update:1000] ~/.config/hyprlock/layouts/layout2/Scripts/nowplaying/nowplaying.sh
    color = rgba(255, 255, 255, 0.8)
    font_size = 18
    font_family = JetBrains Mono Nerd, SF Pro Display Bold
    position = 0, 0       # Middle row, center column
    halign = center
    valign = center
}

# User name (middle-right)
label {
    monitor =
    text =     $USER
    color = rgba(216, 222, 233, 0.80)
    outline_thickness = 2
    font_size = 18
    font_family = SF Pro Display Bold
    position = 250, 0     # Middle row, right column
    halign = center
    valign = center
}

# --- BOTTOM ROW (Time + Input Field) ---
# Time (bottom-left)
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgba(216, 222, 233, 0.70)
    font_size = 120
    font_family = SF Pro Display Bold
    position = -200, 250
    halign = center
    valign = bottom
}

# Input Field (bottom-center)
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = <i><span foreground="##ffffff99">🔒 Enter Password</span></i>
    hide_input = false
    position = 0, 250
    halign = center
    valign = bottom
}

# Optionally: bottom-right can be used for extra info

# Reboot
label {
    monitor =
    text = 󰜉
    color = rgba(255, 255, 255, 0.6)
    font_size = 50
    onclick = reboot now
    position = 0, 100
    halign = center
    valign = bottom
}

# Power off
label {
    monitor =
    text = 󰐥
    color = rgba(255, 255, 255, 0.6)
    font_size = 50
    onclick = shutdown now
    position = 820, 100
    halign =left 
    valign = bottom
}

# Suspend
label {
    monitor =
    text = 󰤄
    color = rgba(255, 255, 255, 0.6)
    font_size = 50
    onclick = echo mem > /sys/power/state
    position = -820, 100
    halign = right
    valign = bottom
}
