# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
#monitor=,preferred,auto,auto
#monitor = DP-1, 1920x1080@99.93, 0x0, 1
#monitor = HDMI-A-1, 1920x1080@75, 0x1, 1

monitor=DP-1,1920x1080@99.93Hz,0x0,1
monitor=HDMI-A-1,1920x1080@75Hz,-1920x0,1


# Make primary

exec-once = hyprctl dispatch focusmonitor DP-1

 # Seperate workspaces between monitors.

workspace=1,monitor:DP-1
workspace=2,monitor:HDMI-A-1

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = st
$fileManager = st lf
#$menu = Vicinae-run
$browser = st librewolf-bin

# Used to log crashes

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox


# Clean up audio

exec-once = /home/ram/audio

# Hardcoded, eww.


# My computer over heats after a few hours of max usage. (CPU and GPU.) This should fix that.

# su -c "yes | /usr/sbin/sensors-detect" - Automate this.


# Enable Notifications

exec-once = mako >/dev/null 2>&1 &

# Set programs to use Wayland

exec-once = export OZONE_PLATFORM=wayland
exec-once = export XDG_SESSION_TYPE=wayland
exec-once = export ELECTRON_OZONE_PLATFORM_HINT=auto
exec-once = export MOZ_ENABLE_WAYLAND=1
exec-once = pactl set-card-profile alsa_card.pci-0000_09_00.1 output:hdmi-stereo-extra1

# Screensharing

exec-once = gentoo-pipewire-launcher &
exec-once = /usr/libexec/xdg-desktop-portal -r &
#/usr/libexec/xdg-desktop-portal-wlr &
exec-once = /usr/libexec/xdg-desktop-portal-gtk &

# Other Programs

exec-once = clip-board-sync &
exec-once = pipewire &
exec-once = wireplumber &
exec-once = pipewire-pulse &
exec-once = sunshine.AppImage &
exec-once = /home/ram/audio &
exec-once = find ~/.local/appimage -maxdepth 1 -type f -name "*.AppImage" -print0 | \ xargs -0 -I {} ln -sf "{}" ~/.local/bin/


# Fix NVENC

exec-once = st nvidia-smi

# Set programs as Dark Mode

exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

# Set Wallpaper

exec-once = swaybg -i .config/RamOS/Wallpapers/wallpaper.png &

# Start runner server

#exec-once = ~/.local/bin/Vicinae-04608039d-x86_64.AppImage server &

# Set cursor

exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Ice'


# Start SFWBar

exec-once = sfwbar

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/


# Make sure emerge --ask x11-themes/gentoo-xcursors is build?
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_THEME,Adwaita

# Nvidia Support

env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia


# Chromium + Wayland + Nvidia + Hardware acceleration causes a ton of graphical issues if you are unlucky, this should hopfully fix that

env = ELECTRON_OZONE_PLATFORM_HINT,auto

###################
### PERMISSIONS ###
###################

# See https://wiki.hyprland.org/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

cursor {
    no_hardware_cursors = true
}

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 1
    gaps_out = 5 # Blame *him* for this

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

general:snap {
    enabled = true
    window_gap = 25 # pixels
    monitor_gap = 10 # pixels
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

#windowrulev2 = float, class:.*

# Does not work the best, and *sucks* for games


#workspace = 1, layoutopt:float
# Floating with multi monitor fixed
#workspace = 2, layoutopt:float


# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = gb
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = false
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, R, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, M, exec, st pulsemixer
#bind = $mainMod, L, exec, swaylock -i ~/.config/RamOS/Wallpapers/lockscreen.png
bind = $mainMod, L, exec, swaylock -d --screenshots --effect-blur 100x10
bind = $mainMod, F1, exec, st python3.14 ~/.local/bin/RamOS/settings.py

#bind = $mainMod, Space, exec, $menu
bind = $mainMod, W, exec, ~/.local/bin/LibreWolf.AppImage

bind = $mainMod, H, exec, st htop

#bind = SUPER_SHIFT, Print, exec, hyprctl dispatch /home/ram/.local/bin/screenshotre

bind = , Print, exec, ~/.local/bin/screenshot
bind = SHIFT, Print, exec, ~/.local/bin/screenshotre

# Fix for Chromium full screen absorbing

#bind = SHIFT, Print, exec, grim -g "$(slurp)" ~/Pictures/screenshot_$(date +%s).png
#bind = , Print, exec, grim ~/Pictures/screenshot_$(date +%s).png



bind = $mainMod, F, fullscreen

# windowrulev2 = tile, fullscreenstate 0 3, class:^(helium)$ # Fullscreen fix for Chromium
# windowrulev2 = tile, floatfullscreen 1, class:^(librewolf|helium|Chromium)$
windowrulev2 = tile, floatfullscreen 1, fullscreenstate 0 1, class:^(librewolf|helium|Chromium)$

#bind = $mainMod, Space, exec, ~/.local/bin/Vicinae-04608039d-x86_64.AppImage toggle


## Alt + Tab

bind = ALT, Tab, cyclenext, bringactivetotop # to switch between tabs in currrent workspace

#bind = ALT, Tab, workspace, previous # to switch between tabs in all workspaces (like gnome)


# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

windowrulev2 = fullscreenstate 0 0, class:^(Chromium)$

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

debug:disable_logs = false

##############################
### Plugins ###
##############################

plugin {
    hyprbars {
        enabled = true
        bar_height = 28
        bar_blur = true
        bar_part_of_window = true
        bar_precedence_over_border = true
        bar_padding = 10
        bar_text_size = 12
        bar_text_font = "JetBrainsMono Nerd Font"
        bar_text_align = center

        bar_buttons_alignment = right
        bar_button_padding = 8
        icon_on_hover = false

        # Modern Windows-style buttons (Right-to-Left)
        hyprbars-button = rgb(ff4040), 18, , hyprctl dispatch killactive   # Close
        hyprbars-button = rgb(eeee11), 18, , hyprctl dispatch fullscreen 1 # Maximize
        hyprbars-button = rgb(40ff40), 18, , hyprctl dispatch togglefloating     # Minimize, well close enough


	#hyprbars-button = rgb(40ff40), 18, , hyprctl dispatch movetoworkspacesilent     # Minimize
	#movetoworkspacesilent special:MinimizedApps

        on_double_click = hyprctl dispatch fullscreen 1
    }
}
